<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hit the 90s — Book 9</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#F1F5F9;min-height:100vh;color:#1E293B;}
header{background:#FDF8F0;border-bottom:2px solid #E8D9B8;}
.header-inner{padding:20px;text-align:center;}
.badge-wrap{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);padding:6px 16px;border-radius:20px;margin-bottom:10px;}
.badge-dot{width:7px;height:7px;border-radius:50%;background:#FCD34D;}
.badge-text{color:#FCD34D;font-size:11px;font-weight:700;letter-spacing:1.5px;}
header h1{color:#fff;font-size:22px;font-weight:700;}
header p{color:rgba(255,255,255,0.85);font-size:14px;margin-top:5px;}
.container{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
#selector{padding:6px 0;}
.sel-title{text-align:center;font-size:11px;font-weight:700;color:#64748B;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px;}
.test-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
.test-btn{background:#fff;border:1.5px solid #E2E8F0;border-radius:12px;padding:16px 6px 12px;cursor:pointer;text-align:center;transition:all 0.18s;}
.test-btn:hover{border-color:#2E5F8A;background:#EFF6FF;transform:translateY(-2px);box-shadow:0 4px 14px rgba(30,58,95,0.13);}
.test-btn .num{font-size:22px;font-weight:800;color:#1E3A5F;display:block;}
.test-btn .lbl{font-size:9px;color:#94A3B8;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:3px;display:block;}
.info-card{background:#fff;border-radius:12px;padding:14px 18px;border:1.5px solid #E2E8F0;text-align:center;}
.info-card p{font-size:13px;color:#64748B;} .info-card strong{color:#1E3A5F;}
#quiz{display:none;}
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.back-btn{background:none;border:none;cursor:pointer;color:#2E5F8A;font-size:13px;font-weight:600;padding:6px 0;}
.quiz-label{font-size:16px;font-weight:700;color:#1E3A5F;}
.pass-badge{margin-left:auto;background:#EFF6FF;color:#1E3A5F;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;}
.prog-wrap{margin-bottom:18px;}
.prog-info{display:flex;justify-content:space-between;margin-bottom:6px;}
.prog-info span{font-size:11px;color:#94A3B8;font-weight:500;}
.prog-track{background:#E2E8F0;border-radius:99px;height:5px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#2E5F8A,#1E3A5F);border-radius:99px;transition:width 0.4s ease;}
.q-card{background:#fff;border-radius:16px;padding:24px 18px;box-shadow:0 2px 16px rgba(30,58,95,0.07);margin-bottom:14px;border:1px solid #E8EFF7;}
.q-label{font-size:10px;font-weight:700;color:#2E5F8A;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.q-text{font-size:16px;font-weight:500;color:#1E293B;line-height:1.6;margin-bottom:20px;}
.choices{display:flex;flex-direction:column;gap:9px;}
.choice{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid #E2E8F0;border-radius:10px;cursor:pointer;transition:all 0.15s;background:#FAFCFF;}
.choice:hover:not(.locked){border-color:#2E5F8A;background:#EFF6FF;}
.choice-letter{width:28px;height:28px;border-radius:50%;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#64748B;flex-shrink:0;transition:all 0.15s;}
.choice-text{font-size:14px;color:#334155;flex:1;}
.choice.selected{border-color:#2E5F8A;background:#EFF6FF;} .choice.selected .choice-letter{background:#2E5F8A;color:#fff;}
.choice.correct{border-color:#16A34A;background:#F0FDF4;} .choice.correct .choice-letter{background:#16A34A;color:#fff;}
.choice.wrong{border-color:#DC2626;background:#FEF2F2;} .choice.wrong .choice-letter{background:#DC2626;color:#fff;}
.choice.locked{cursor:default;}
.feedback{display:none;margin-top:12px;padding:11px 14px;border-radius:9px;font-size:13px;font-weight:600;}
.feedback.correct-fb{background:#F0FDF4;color:#15803D;border:1px solid #86EFAC;display:block;}
.feedback.wrong-fb{background:#FEF2F2;color:#B91C1C;border:1px solid #FCA5A5;display:block;}
.nav-row{display:flex;gap:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.nav-btn.primary{background:linear-gradient(135deg,#1E3A5F,#2E5F8A);color:#fff;}
.nav-btn.primary:hover{opacity:0.9;}
.nav-btn.secondary{background:#fff;color:#64748B;border:1.5px solid #E2E8F0;}
.nav-btn.secondary:hover{border-color:#2E5F8A;color:#2E5F8A;}
.nav-btn:disabled{opacity:0.35;cursor:not-allowed;}
#results{display:none;}
.result-hero{background:linear-gradient(135deg,#1E3A5F,#2E5F8A);border-radius:16px;padding:30px 20px;text-align:center;margin-bottom:16px;}
.result-score{font-size:58px;font-weight:800;color:#fff;line-height:1;}
.result-total{font-size:14px;color:rgba(255,255,255,0.55);margin-top:4px;}
.result-badge{display:inline-block;padding:7px 18px;border-radius:20px;font-size:13px;font-weight:700;margin-top:14px;}
.result-badge.pass{background:#DCFCE7;color:#15803D;} .result-badge.fail{background:#FEE2E2;color:#B91C1C;}
.result-msg{color:rgba(255,255,255,0.65);font-size:13px;margin-top:10px;}
.review-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;border:1px solid #E8EFF7;}
.review-card h3{font-size:11px;font-weight:700;color:#1E3A5F;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}
.review-item{padding:10px 0;border-bottom:1px solid #F1F5F9;}
.review-item:last-child{border-bottom:none;}
.review-q{font-size:12px;color:#475569;margin-bottom:5px;line-height:1.4;}
.review-ans{display:flex;gap:10px;font-size:12px;font-weight:600;}
.w{color:#DC2626;} .r{color:#16A34A;}
.action-row{display:flex;flex-direction:column;gap:9px;}
.action-btn{padding:14px;border-radius:11px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.action-btn.primary{background:linear-gradient(135deg,#1E3A5F,#2E5F8A);color:#fff;}
.action-btn.primary:hover{opacity:0.9;}
.action-btn.outline{background:#fff;color:#64748B;border:1.5px solid #E2E8F0;}
.action-btn.outline:hover{border-color:#2E5F8A;color:#2E5F8A;}
.footer{text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid #E2E8F0;}
.footer p{font-size:11px;color:#800020;font-weight:600;line-height:1.8;}
.footer .brand{font-size:13px;font-weight:700;color:#800020;margin-top:2px;}</style>
</head>
